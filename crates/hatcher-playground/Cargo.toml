[package]
name = "hatcher-playground"
description = "Rehearsal arena for the Hatcher agent mesh: controlled task scenarios, cohort presets, and coefficient battles."
keywords = ["agentic", "mesh", "multi-agent", "simulation", "playground"]
categories = ["algorithms", "science", "simulation"]
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true

[features]
default = []
# Pass through to hatcher-neural: load an .onnx policy as the decision head.
onnx = ["hatcher-neural/onnx"]

[dependencies]
hatcher-core = { path = "../hatcher-core", version = "1.0.0" }
hatcher-neural = { path = "../hatcher-neural", version = "1.0.0" }
serde.workspace = true
serde_json.workspace = true
