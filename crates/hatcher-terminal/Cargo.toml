[package]
name = "hatcher-terminal"
description = "The HAMNS observatory: a 3D ANSI terminal renderer that makes the Hatcher agent mesh visible — node graphs, trust matrices, live equations, and an active-node tornado vortex."
keywords = ["agentic", "mesh", "terminal", "visualization", "tui"]
categories = ["command-line-utilities", "visualization", "simulation"]
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true

[features]
default = []
# Pass through to hatcher-neural: load an .onnx policy as the decision head.
onnx = ["hatcher-neural/onnx", "hatcher-playground/onnx"]

# The renderer is deliberately dependency-free beyond the mesh itself: it writes
# ANSI directly, so the observatory builds on the workspace MSRV and adds no
# terminal backend to version-match against the host.
[dependencies]
hatcher-core = { path = "../hatcher-core", version = "0.23.0" }
hatcher-neural = { path = "../hatcher-neural", version = "0.23.0" }
hatcher-playground = { path = "../hatcher-playground", version = "0.23.0" }

[[bin]]
name = "hatcher-terminal"
path = "src/main.rs"
