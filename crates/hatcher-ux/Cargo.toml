[package]
name = "hatcher-ux"
description = "Terminal console and HTTP API for the Hatcher agent mesh, shaped for the hatcher-host-frontend dashboard."
keywords = ["agentic", "mesh", "multi-agent", "terminal", "api"]
categories = ["command-line-utilities", "science", "simulation"]
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
# Overrides the workspace MSRV: the warp/tokio dependency tree needs 1.86, verified
# by compiling against 1.85 (fails) and 1.86 (passes).
rust-version = "1.86"

[features]
default = []
# Pass through to hatcher-neural: load an .onnx policy as the decision head.
onnx = ["hatcher-neural/onnx", "hatcher-playground/onnx"]

[dependencies]
hatcher-core = { path = "../hatcher-core", version = "0.23.0" }
hatcher-neural = { path = "../hatcher-neural", version = "0.23.0" }
hatcher-playground = { path = "../hatcher-playground", version = "0.23.0" }
serde.workspace = true
serde_json.workspace = true
warp = "0.3"
tokio = { version = "1", features = ["full"] }
