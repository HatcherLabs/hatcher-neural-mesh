name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  RUSTFLAGS: -Dwarnings

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-features --locked
      - name: Restricted sidecar smoke
        run: |
          cargo build --locked -p hatcher-ux
          scripts/smoke-shadow-sidecar.sh target/debug/hatcher-ux
      - name: Production script syntax
        run: bash -n scripts/deploy-production.sh scripts/smoke-shadow-sidecar.sh
      - name: Production container
        run: docker build --tag hatcher-neural-mesh-ci .
